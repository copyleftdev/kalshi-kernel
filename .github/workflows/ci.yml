name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  local-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - run: ./scripts/check-generated.sh
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz '^FuzzLoadNeverEnablesUnexpectedMode$' -fuzztime=10s ./internal/config
      - run: go vet ./...
      - run: go build -buildvcs=false -o /tmp/kalshi-kernel ./cmd/kalshi-kernel

  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/conformance.sh

  upstream-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./scripts/test-upstream.sh --require-current --conformance

  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - run: ./scripts/public-check.sh
      - run: docker build --tag kalshi-kernel:ci .
